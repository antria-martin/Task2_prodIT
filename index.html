<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Stop Watch</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
  </head>
  <body>
    
        <div class="StopWatch">

            <h1><span class="blueglow">StopWatch</span><span class="lightblueglow">Task2</span></h1>
            <div class="circles">
               <p>00:00:00</p> 
              <div class="circle"></div>
              <div class="circle"></div>
              <div class="circle"></div>
            </div>
            <div class="controls">
                <button>
                    <ion-icon class="play" name="play"></ion-icon> 
                    <ion-icon class="pause" name="pause"></ion-icon>
                </button>
                <button>
                    <ion-icon class="lap" name="stopwatch-outline"></ion-icon>
                <button>
                    <ion-icon class="reset" name="refresh"></ion-icon>
                </button>
            </div>
          </div>
          <ul class="laps">
          </ul>



	<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  </body>
</html>
